# Builds and deploys Omr, the sheet reader core calls, for the ki-cl-omr-develop trigger (ki-cl-omr-dev) and
# ki-cl-omr-main (ki-cl-omr). Both run only when a file under Omr/ changes.
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args: ['build', '--no-cache', '-t', '$_IMAGE', '-f', 'Omr/Dockerfile', 'Omr']

  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ['push', '$_IMAGE']

  # Only core may call it. Open to anyone, it would read sheets for whoever sends them, on 2 vCPUs each.
  - id: Private
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if gcloud run services get-iam-policy $_SERVICE_NAME --region=$_DEPLOY_REGION --format='value(bindings.members)' | grep -qE 'allUsers|allAuthenticatedUsers'; then
          echo "$_SERVICE_NAME lets anyone invoke it. Remove allUsers and allAuthenticatedUsers before deploying."
          exit 1
        fi

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --platform=managed
      - --image=$_IMAGE
      - --region=$_DEPLOY_REGION
      - --no-allow-unauthenticated
      - --ingress=all
      - --cpu=2
      - --memory=4Gi
      - --concurrency=1
      - --timeout=300
      - --max-instances=2
      - --cpu-boost
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
      - --quiet

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: us-central1
  _SERVICE_NAME: ki-cl-omr-dev
  _IMAGE: ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/ki.cl-api/${_SERVICE_NAME}:${COMMIT_SHA}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

images:
  - $_IMAGE
